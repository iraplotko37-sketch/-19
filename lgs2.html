<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass — Glass HQ Demo</title>
<link rel="stylesheet" href="https://esm.sh/@glass-sdk/liquid-glass@0.0.2/styles.css">
<script src="https://ga.jspm.io/npm:es-module-shims@1.8.2/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@glass-sdk/liquid-glass": "https://esm.sh/@glass-sdk/liquid-glass@0.0.2?external=react,react-dom"
  }
}
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#0a0a12;overflow:hidden}
#root{height:100vh}
.scene-wrap{position:relative;width:100%;height:100vh;overflow:hidden}
/* подсказки */
.badge{position:absolute;z-index:10;left:50%;transform:translateX(-50%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.badge-top{top:14px;background:rgba(255,59,48,.92);color:#fff;border-color:rgba(255,255,255,.25);display:none}
.badge-top.show{display:block}
.badge-bottom{bottom:16px;background:rgba(20,20,28,.55);color:rgba(255,255,255,.85);font-weight:500;letter-spacing:.02em}
.card-title{font-size:16px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.2}
.card-sub{font-size:12.8px;opacity:.68;margin:6px 0 0;line-height:1.5}
.row{display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158;box-shadow:0 0 8px #30d158;flex:none}
.divider{width:1px;height:22px;background:rgba(0,0,0,.1)}
/* CSS фолбэк если WebGPU нет — делаем стекло хотя бы блюром */
.fallback-glass{
  background:rgba(255,255,255,.14)!important;
  backdrop-filter:blur(22px) saturate(180%)!important;
  -webkit-backdrop-filter:blur(22px) saturate(180%)!important;
  border:1px solid rgba(255,255,255,.28)!important;
  box-shadow:0 12px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.35)!important;
}
@media(max-width:760px){
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, {useState,useEffect} from "react"
import {createRoot} from "react-dom/client"
import {GlassScene, GlassContent, GlassSurface, GlassButton, GlassToolbar} from "@glass-sdk/liquid-glass"
const h = React.createElement

function App(){
  const [hasGPU,setHasGPU]=useState(null)
  const [material,setMaterial]=useState("regular")
  const [appearance,setAppearance]=useState("light")
  const [playing,setPlaying]=useState(true)

  useEffect(()=>{
    let ok=true
    if(!navigator.gpu){ setHasGPU(false); return }
    navigator.gpu.requestAdapter().then(a=>{ if(ok) setHasGPU(!!a) }).catch(()=>{ if(ok) setHasGPU(false)})
    return()=>{ok=false}
  },[])

  const bg="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80&auto=format&fit=crop"
  const cover="https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/e8/43/5f/e8435ffa-b6b9-b171-40ab-4ff3959ab661/886443919266.jpg/400x400bb.jpg"

  return h("div",{className:"scene-wrap"},
    h("div",{className:"badge badge-top"+(hasGPU===false?" show":"")}, "⚠️ WebGPU не найден — открой через HTTPS / localhost в Chrome 113+ · показан CSS-фолбэк"),
    h("div",{className:"badge badge-bottom"},"Нажми и потяни стекло — оно упруго тянется и преломляет фон  •  Двойной клик = 3D tilt"),

    h(GlassScene,{style:{position:"absolute",inset:0,width:"100vw",height:"100vh"}},
      h(GlassContent,null,
        h("img",{src:bg,alt:"bg",style:{width:"100%",height:"100%",objectFit:"cover"}}),
        h("div",{style:{position:"absolute",inset:0,background:"radial-gradient(900px 500px at 28% 18%, rgba(255,255,255,.22), transparent 60%), linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.42))"}}),
        h("div",{style:{position:"absolute",inset:0,opacity:.18,background:"url('https://grainy-gradients.vercel.app/noise.svg')"}})
      ),

      // ——— Топ тулбар ———
      h(GlassToolbar,{material,appearance,style:{position:"absolute",top:20,left:"50%",transform:"translateX(-50%)",padding:"6px 8px",borderRadius:999,display:"flex",gap:6,alignItems:"center"}},
        h(GlassButton,{material,appearance,size:"sm",onClick:()=>setMaterial(material==="regular"?"clear":"regular")}, material==="regular"?"Regular":"Clear"),
        h(GlassButton,{material,appearance,size:"sm",onClick:()=>setAppearance(appearance==="light"?"dark":"light")}, appearance==="light"?"☀️ Light":"🌙 Dark"),
        h("div",{className:"divider"}),
        h(GlassButton,{material,appearance,size:"sm",onClick:()=>window.open("https://github.com/Glass-HQ/liquid-glass","_blank")}, "GitHub"),
        h(GlassButton,{material:"clear",appearance,size:"sm",onClick:()=>{navigator.clipboard.writeText("npm install @glass-sdk/liquid-glass@~0.0.2"); alert("Скопировано: npm install @glass-sdk/liquid-glass@~0.0.2")}}, "npm")
      ),

      // ——— Левая карта-плеер ———
      h(GlassSurface,{material,appearance,style:{position:"absolute",left:"5%",top:"16%",width:360,padding:22,borderRadius:32,display:"flex",flexDirection:"column",gap:14}},
        h("div",{className:"row"},
          h("img",{src:cover,style:{width:56,height:56,borderRadius:14,objectFit:"cover",boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}),
          h("div",null,
            h("div",{className:"row"}, h("span",{className:"dot"}), h("span",{style:{fontSize:10,letterSpacing:".09em",opacity:.55,fontWeight:800}}, "NOW PLAYING")),
            h("p",{className:"card-title",style:{marginTop:4}},"Instant Crush"),
            h("p",{className:"card-sub",style:{marginTop:2}},"Daft Punk • Random Access Memories")
          )
        ),
        h("div",{style:{display:"flex",gap:8,marginTop:2}},
          h(GlassButton,{material,appearance,style:{flex:1},onClick:()=>setPlaying(!playing)}, playing?"⏸ Пауза":"▶︎ Плей"),
          h(GlassButton,{material,appearance,onClick:()=>alert("⏭ Следующий трек")}, "⏭"),
          h(GlassButton,{material,appearance,onClick:()=>alert("♡ В избранное")}, "♡")
        ),
        h("div",{style:{height:5,background:appearance==="light"?"rgba(0,0,0,.08)":"rgba(255,255,255,.14)",borderRadius:999,overflow:"hidden",marginTop:6}},
          h("div",{style:{width:"62%",height:"100%",background:appearance==="light"?"#111":"#fff",borderRadius:999,transition:"width .6s"}})
        ),
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,opacity:.55,fontWeight:600}},
          h("span",null,"1:51"), h("span",null,"5:37")
        )
      ),

      // ——— Правая инфо-карта — классika дизайн ———
      h(GlassSurface,{material,appearance,style:{position:"absolute",right:"5%",top:"20%",width:320,padding:22,borderRadius:28}},
        h("p",{className:"card-title"},"Жидкое стекло — реально"),
        h("p",{className:"card-sub"},"Библиотека ",h("b",null,"@glass-sdk/liquid-glass")," от Glass HQ. Преломление, blur и упругая физика на WebGPU (vgpu). Требует HTTPS/localhost."),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}},
          h(GlassButton,{material,appearance,onClick:()=>window.open("https://liquid-glass.glassapp.dev","_blank")}, "Демо сайта"),
          h(GlassButton,{material:"clear",appearance,onClick:()=>alert("npm install @glass-sdk/liquid-glass@~0.0.2\n\nReact 19+ и WebGPU обязательны")}, "Установить")
        ),
        h("div",{style:{marginTop:12,display:"flex",gap:6,flexWrap:"wrap"}},
          ["Surface","Button","Toolbar","Tabs","Menu","Slider"].map(t=> h("span",{key:t,style:{fontSize:10,padding:"4px 8px",borderRadius:999,background:appearance==="light"?"rgba(0,0,0,.06)":"rgba(255,255,255,.10)",fontWeight:700,letterSpacing:".04em"}}, t))
        )
      ),

      // ——— Нижний док ———
      h(GlassSurface,{material,appearance,style:{position:"absolute",bottom:52,left:"50%",transform:"translateX(-50%)",display:"flex",gap:10,padding:"10px 14px",borderRadius:28,alignItems:"center"}},
        ...["◯","⬢","⬣","⬔","⬕"].map((icon,i)=> h(GlassButton,{key:i,material,appearance,size:"icon",shape:"circle",onClick:()=>alert("Док кнопка "+(i+1))}, h("span",{style:{fontSize:18}},icon))),
        h("div",{className:"divider",style:{margin:"0 2px"}}),
        h(GlassButton,{material,appearance,size:"sm",style:{borderRadius:999,padding:"0 16px",fontWeight:700},onClick:()=>alert("Get started — стекло работает!")}, "Get started")
      ),

      // ——— Малый бейдж слева снизу ———
      h(GlassSurface,{material:"clear",appearance,style:{position:"absolute",left:"5%",bottom:52,padding:"10px 16px",borderRadius:999,display:"flex",gap:8,alignItems:"center"},className:"hide-m"},
        h("span",{style:{fontSize:12.5,fontWeight:600,opacity:.85}},"✨ Перетаскивай — стекло преломляет фон в реальном времени")
      )
    )
  )
}
createRoot(document.getElementById("root")).render(h(App))
</script>
</body>
</html>
