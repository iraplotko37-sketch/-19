<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Учебники</title>

    <meta name="theme-color" content="#4A6FD4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href='data:application/manifest+json,{"name":"Учебники","short_name":"Учебники","start_url":".","display":"standalone","background_color":"#4A6FD4","theme_color":"#4A6FD4","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3652/3652191.png","sizes":"512x512","type":"image/png"}]}' />

    <style>
        :root {
            --bg-top: #5B7FE8;
            --bg-bottom: #3A55B8;
            --card-bg: rgba(255, 255, 255, 0.10);
            --card-bg-hover: rgba(255, 255, 255, 0.16);
            --card-border: rgba(255, 255, 255, 0.18);
            --accent: #FDE047;
            --accent-dark: #EAB308;
            --shadow: 0 18px 35px -12px rgba(15, 23, 60, 0.45);
            --shadow-hover: 0 24px 45px -12px rgba(15, 23, 60, 0.55);
            --radius: 26px;
            --radius-sm: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            padding: 24px 20px 48px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            /* Глубокий градиент вместо жидкого стекла */
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(255,255,255,0.22), transparent 60%),
                radial-gradient(900px 500px at 85% 110%, rgba(255,255,255,0.14), transparent 60%),
                radial-gradient(700px 400px at 50% 40%, rgba(255, 253, 180, 0.08), transparent 70%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
        }

        .container { max-width: 1200px; width: 100%; }

        /* Заголовок без размытия */
        .header {
            text-align: center;
            margin-bottom: 36px;
            padding: 18px 0 8px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 12px 36px;
            border-radius: 60px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .header h1 svg {
            width: 34px; height: 34px;
            fill: #fff;
            flex-shrink: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 22px;
            align-items: stretch;
        }

        /* КАРТОЧКА: без размытия, градиентный полупрозрачный слой */
        .book-card {
            background: linear-gradient(155deg, var(--card-bg), rgba(255,255,255,0.04));
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 18px 16px 20px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            height: 100%;
            min-height: 360px;
            max-height: 400px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            content-visibility: auto;
            contain: layout paint style;
            contain-intrinsic-size: auto 380px;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,0.25);
            background: linear-gradient(155deg, var(--card-bg-hover), rgba(255,255,255,0.06));
        }
        .book-card:active {
            transform: scale(0.97);
            transition-duration: 0.05s;
        }

        .cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15),
                        inset 0 2px 0 rgba(255,255,255,0.12),
                        0 6px 14px rgba(15, 23, 60, 0.25);
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s ease;
        }
        .cover:active { transform: scale(0.97); }

        .cover-algebra    { background: linear-gradient(145deg, #2b3b8f, #1a265a); }
        .cover-bel-lit    { background: linear-gradient(145deg, #1f7a5c, #0f4a37); }
        .cover-bel-yaz    { background: linear-gradient(145deg, #1a8a7a, #0d5a4e); }
        .cover-eng        { background: linear-gradient(145deg, #b13e3e, #7a2626); }
        .cover-world-hist { background: linear-gradient(145deg, #a67c3e, #6b4f24); }
        .cover-bio        { background: linear-gradient(145deg, #2d7d3a, #1a4f24); }
        .cover-geo        { background: linear-gradient(145deg, #2b7a9e, #164a64); }
        .cover-info       { background: linear-gradient(145deg, #5b3d8f, #37245a); }
        .cover-art        { background: linear-gradient(145deg, #b14a7a, #7a2a50); }
        .cover-hist-bel   { background: linear-gradient(145deg, #8f2b2b, #5a1a1a); }
        .cover-rus-lit    { background: linear-gradient(145deg, #1f3a7a, #12204a); }
        .cover-rus-lit2   { background: linear-gradient(145deg, #2a4a6a, #162a3e); }
        .cover-phys       { background: linear-gradient(145deg, #3a3a8a, #22225a); }
        .cover-chem       { background: linear-gradient(145deg, #b17a2a, #6b4a16); }
        .cover-geom       { background: linear-gradient(145deg, #1a7a7a, #0d4a4a); }
        .cover-rus-yaz    { background: linear-gradient(145deg, #8f2b4a, #5a1a2e); }

        .cover svg {
            width: 62px; height: 62px;
            fill: rgba(255, 255, 255, 0.95);
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .cover .title-on-cover {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
            letter-spacing: 0.02em;
            word-break: break-word;
            max-width: 100%;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: center;
        }

        .cover .badge-pdf {
            position: absolute;
            bottom: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Кнопка с прогресс-баром */
        .btn-download {
            width: 100%;
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            color: #3a3a1a;
            font-weight: 800;
            font-size: 14px;
            padding: 12px 8px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            box-shadow: 0 6px 18px rgba(253, 224, 71, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
            text-decoration: none;
            margin-top: auto;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn-download:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 26px rgba(253, 224, 71, 0.45), inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .btn-download:active {
            transform: scale(0.94);
            transition-duration: 0.05s;
        }
        .btn-download[disabled] {
            cursor: wait;
            pointer-events: none;
        }
        .btn-download svg {
            width: 17px; height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .btn-download .progress-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0%;
            background: rgba(58, 58, 26, 0.18);
            transition: width 0.15s ease;
            pointer-events: none;
        }
        .btn-download .btn-label {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-toast {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 60, 0.95);
            color: #fff;
            padding: 13px 26px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.28s ease, opacity 0.28s ease;
            z-index: 100;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            line-height: 1.4;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .status-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 25px; padding: 10px 24px; gap: 10px; }
            .header h1 svg { width: 27px; height: 27px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .book-card { padding: 14px 12px 16px; border-radius: 22px; min-height: 300px; max-height: 340px; }
            .cover svg { width: 48px; height: 48px; }
            .cover .title-on-cover { font-size: 14px; }
            .btn-download { font-size: 12px; padding: 10px 6px; }
        }
        @media (max-width: 400px) {
            .grid { grid-template-columns: 1fr 1fr; gap: 11px; }
            .book-card { min-height: 260px; max-height: 300px; padding: 10px 8px 14px; }
            .cover svg { width: 36px; height: 36px; }
            .cover .title-on-cover { font-size: 13px; }
            .btn-download { font-size: 10px; padding: 8px 4px; }
            .btn-download svg { width: 13px; height: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>
                <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                Учебники
            </h1>
        </header>

        <div class="grid" id="bookGrid"></div>
    </div>

    <div class="status-toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        const BOOKS = [
            { id: 'algebra',    name: 'Алгебра',                coverClass: 'cover-algebra',    url: 'https://files.catbox.moe/rel6qh.pdf' },
            { id: 'bel-lit',    name: 'Белорусская литература', coverClass: 'cover-bel-lit',    url: 'https://files.catbox.moe/6ejsw0.pdf' },
            { id: 'bel-yaz',    name: 'Белорусский язык',       coverClass: 'cover-bel-yaz',    url: 'https://files.catbox.moe/qfmn4n.pdf' },
            { id: 'eng',        name: 'Английский язык',        coverClass: 'cover-eng',        url: 'https://files.catbox.moe/1wupe4.pdf' },
            { id: 'world-hist', name: 'Всемирная история',      coverClass: 'cover-world-hist', url: 'https://files.catbox.moe/48hf34.pdf' },
            { id: 'bio',        name: 'Биология',               coverClass: 'cover-bio',        url: 'https://files.catbox.moe/a2webl.pdf' },
            { id: 'geo',        name: 'География',              coverClass: 'cover-geo',        url: 'https://files.catbox.moe/oun1pw.pdf' },
            { id: 'info',       name: 'Информатика',            coverClass: 'cover-info',       url: 'https://files.catbox.moe/afeiv5.pdf' },
            { id: 'art',        name: 'Искусство',              coverClass: 'cover-art',        url: 'https://files.catbox.moe/a0hvbm.pdf' },
            { id: 'hist-bel',   name: 'История Беларуси',       coverClass: 'cover-hist-bel',   url: 'https://files.catbox.moe/b293yj.pdf' },
            { id: 'rus-lit',    name: 'Русская литература',     coverClass: 'cover-rus-lit',    url: 'https://files.catbox.moe/hglgkq.pdf' },
            { id: 'rus-lit2',   name: 'Русская литература 2',   coverClass: 'cover-rus-lit2',   url: 'https://files.catbox.moe/n3ladm.pdf' },
            { id: 'phys',       name: 'Физика',                 coverClass: 'cover-phys',       url: 'https://files.catbox.moe/h7esv9.pdf' },
            { id: 'chem',       name: 'Химия',                  coverClass: 'cover-chem',       url: 'https://files.catbox.moe/a91pjk.pdf' },
            { id: 'geom',       name: 'Геометрия',              coverClass: 'cover-geom',       url: 'https://files.catbox.moe/xxym0c.pdf' },
            { id: 'rus-yaz',    name: 'Русский язык',           coverClass: 'cover-rus-yaz',    url: 'https://files.catbox.moe/0kpusv.pdf' }
        ];

        const BOOK_ICON_SVG     = '<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>';
        const DOWNLOAD_ICON_SVG = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';

        const STORAGE_KEY = 'textbook_downloads';
        const downloaded  = new Set();

        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(saved)) saved.forEach(id => downloaded.add(id));
        } catch (_) {}

        const saveDownloads = () => {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...downloaded])); }
            catch (_) {}
        };

        const toast = document.getElementById('toast');
        let toastTimer;
        function showToast(message, duration = 2600) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        const blobCache = new Map();

        /** Обновление прогресса на кнопке */
        function updateProgress(btn, percent, text) {
            const fill = btn.querySelector('.progress-fill');
            const label = btn.querySelector('.btn-label');
            if (fill) fill.style.width = percent + '%';
            if (label) label.innerHTML = DOWNLOAD_ICON_SVG + ' ' + text;
        }

        /**
         * МГНОВЕННАЯ ЗАГРУЗКА с прогрессом
         */
        async function downloadBook(book, btn) {
            if (!downloaded.has(book.id)) {
                downloaded.add(book.id);
                saveDownloads();
            }

            btn.setAttribute('disabled', '');
            updateProgress(btn, 5, 'Подключение...');

            try {
                let blob = blobCache.get(book.id);

                if (!blob) {
                    const response = await fetch(book.url, { mode: 'cors' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);

                    const contentLength = +response.headers.get('Content-Length') || 0;

                    // Если есть размер — читаем с прогрессом
                    if (contentLength && response.body) {
                        const reader = response.body.getReader();
                        const chunks = [];
                        let received = 0;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            received += value.length;

                            const percent = Math.min(99, Math.round(received / contentLength * 100));
                            updateProgress(btn, percent, `${percent}%`);
                        }

                        blob = new Blob(chunks, { type: 'application/pdf' });
                    } else {
                        blob = await response.blob();
                    }

                    blobCache.set(book.id, blob);
                }

                updateProgress(btn, 100, 'Сохранение...');

                // Принудительное скачивание как бинарный файл
                const downloadBlob = new Blob([blob], { type: 'application/octet-stream' });
                const fileName = `${book.name.replace(/[^\wа-яА-ЯёЁ\s\-]/g, '')}.pdf`;
                const blobUrl = URL.createObjectURL(downloadBlob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName;
                a.rel = 'noopener';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    if (a.parentNode) a.parentNode.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 1500);

                updateProgress(btn, 100, 'Скачано ✓');
                showToast(`✓ «${book.name}» сохранён`);

                setTimeout(() => {
                    btn.removeAttribute('disabled');
                    updateProgress(btn, 0, 'Скачать');
                }, 1200);

            } catch (err) {
                console.warn('Ошибка загрузки:', err);
                btn.removeAttribute('disabled');
                updateProgress(btn, 0, 'Скачать');
                window.open(book.url, '_blank');
                showToast('Открыто в новой вкладке');
            }
        }

        function render() {
            const grid = document.getElementById('bookGrid');
            const fragment = document.createDocumentFragment();

            BOOKS.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';

                const cover = document.createElement('div');
                cover.className = 'cover ' + book.coverClass;
                cover.innerHTML =
                    BOOK_ICON_SVG +
                    '<div class="title-on-cover"></div>' +
                    '<div class="badge-pdf">PDF</div>';
                cover.querySelector('.title-on-cover').textContent = book.name;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-download';
                btn.innerHTML =
                    '<span class="progress-fill"></span>' +
                    '<span class="btn-label">' + DOWNLOAD_ICON_SVG + ' Скачать</span>';

                const start = () => downloadBook(book, btn);
                cover.addEventListener('click', start);
                btn.addEventListener('click', start);

                card.appendChild(cover);
                card.appendChild(btn);
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        render();
    })();
    </script>
</body>
</html>
