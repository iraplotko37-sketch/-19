<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zala Player — веб-версия</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #141820;
    --surface2: #1a1f2a;
    --stroke: #2a3140;
    --text: #eef1f6;
    --muted: #8b95a8;
    --accent: #fde047;
    --accent-dim: #eab308;
    --live: #ef4444;
    --blue: #3b82f6;
    --radius: 14px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    height: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }
  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 8px;
  }
  .logo {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    font-size: 0.65rem;
    background: var(--surface2);
    border: 1px solid var(--stroke);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .spacer { flex: 1; }
  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--stroke);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: grid; place-items: center;
    font-size: 1rem;
  }
  .btn-icon:hover { border-color: var(--accent-dim); }

  /* Player */
  .player-wrap {
    margin: 0 12px;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    border: 1px solid var(--stroke);
    position: relative;
    aspect-ratio: 16 / 9;
    max-height: 42vh;
  }
  .player-wrap video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
  }
  .player-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: rgba(0,0,0,.55);
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  .player-overlay.show { opacity: 1; pointer-events: auto; }
  .player-overlay .msg {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 0 20px;
    max-width: 420px;
  }
  .now-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 6px;
  }
  .now-title {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--live);
    background: rgba(239,68,68,.12);
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.04em;
  }
  .live-chip::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 3px rgba(239,68,68,.25);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }
  .status {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: auto;
  }

  /* Search + filters */
  .toolbar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 4px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search:focus { border-color: var(--accent-dim); }
  .search::placeholder { color: var(--muted); }
  .groups {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 12px 8px;
    scrollbar-width: none;
  }
  .groups::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    border: 1px solid var(--stroke);
    background: var(--surface);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Channel list */
  .list {
    overflow-y: auto;
    padding: 4px 8px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .channel {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .channel:hover { background: var(--surface); }
  .channel.active {
    background: var(--surface2);
    border-color: var(--accent-dim);
  }
  .ch-logo {
    width: 48px; height: 48px;
    border-radius: 10px;
    background: var(--surface);
    object-fit: contain;
    border: 1px solid var(--stroke);
  }
  .ch-logo.placeholder {
    display: grid; place-items: center;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 700;
  }
  .ch-meta { min-width: 0; }
  .ch-name {
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ch-group {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .ch-num {
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  footer {
    padding: 6px 16px 10px;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--stroke);
  }
  footer a { color: var(--accent-dim); text-decoration: none; }

  /* Fullscreen button overlay */
  .fs-btn {
    position: absolute;
    right: 10px; bottom: 10px;
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
    z-index: 2;
  }
  .fs-btn:hover { background: rgba(0,0,0,.75); }

  @media (min-width: 900px) {
    .app {
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto 1fr auto;
      max-width: 1200px;
      gap: 0 8px;
    }
    header { grid-column: 1 / -1; }
    .player-section {
      grid-row: 2;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .player-wrap {
      max-height: none;
      flex: 1;
      aspect-ratio: auto;
      margin: 0 0 0 12px;
    }
    .side {
      grid-row: 2;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 1px solid var(--stroke);
    }
    .list { flex: 1; }
    footer { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Zala</div>
    <span class="badge">веб-плеер</span>
    <div class="spacer"></div>
    <button class="btn-icon" id="themeBtn" title="Тема" type="button">◐</button>
  </header>

  <div class="player-section">
    <div class="player-wrap" id="playerWrap">
      <video id="video" playsinline controls></video>
      <div class="player-overlay show" id="overlay">
        <div style="font-size:2rem">▶</div>
        <div class="msg" id="overlayMsg">Выберите канал из списка</div>
      </div>
      <button class="fs-btn" id="fsBtn" title="Полный экран" type="button">⛶</button>
    </div>
    <div class="now-bar">
      <span class="live-chip" id="liveChip" style="display:none">LIVE</span>
      <div class="now-title" id="nowTitle">—</div>
      <div class="status" id="status">Готов</div>
    </div>
  </div>

  <div class="side">
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Поиск канала…" autocomplete="off">
    </div>
    <div class="groups" id="groups"></div>
    <div class="list" id="list"></div>
  </div>

  <footer>
    Каналы из плейлиста Zala · воспроизведение через HLS.js ·
    потоки zala.by могут не открываться в браузере (CORS / гео)
  </footer>
</div>

let hls = null;
let current = null;
let activeGroup = "Все";
let dark = true;

const video = document.getElementById("video");
const listEl = document.getElementById("list");
const groupsEl = document.getElementById("groups");
const searchEl = document.getElementById("search");
const nowTitle = document.getElementById("nowTitle");
const statusEl = document.getElementById("status");
const overlay = document.getElementById("overlay");
const overlayMsg = document.getElementById("overlayMsg");
const liveChip = document.getElementById("liveChip");

function setStatus(t) { statusEl.textContent = t; }

function destroyHls() {
  if (hls) {
    try { hls.destroy(); } catch(e) {}
    hls = null;
  }
  video.removeAttribute("src");
  video.load();
}

function playChannel(ch) {
  current = ch;
  nowTitle.textContent = ch.name;
  liveChip.style.display = "inline-flex";
  setStatus("Подключение…");
  overlay.classList.add("show");
  overlayMsg.textContent = "Загрузка «" + ch.name + "»…";
  renderList();

  destroyHls();

  const url = ch.url;
  // try native HLS (Safari) first
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play().then(() => {
      overlay.classList.remove("show");
      setStatus("В эфире");
    }).catch(err => {
      overlayMsg.textContent = "Не удалось запустить поток.\nВозможно, сервер блокирует браузер (CORS/гео).";
      setStatus("Ошибка");
    });
    return;
  }

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      xhrSetup: function(xhr) {
        // some CDNs need no credentials
      }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().then(() => {
        overlay.classList.remove("show");
        setStatus("В эфире");
      }).catch(() => {
        overlayMsg.textContent = "Нажмите ▶ на плеере, чтобы начать";
        setStatus("Ожидание");
      });
    });
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if (data.fatal) {
        let msg = "Ошибка потока";
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          msg = "Сеть / CORS: поток zala.by часто недоступен из браузера.\nВ приложении Android он работает через ExoPlayer.";
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          msg = "Ошибка медиа. Пробуем восстановить…";
          try { hls.recoverMediaError(); return; } catch(e) {}
        }
        overlay.classList.add("show");
        overlayMsg.textContent = msg;
        setStatus("Ошибка");
      }
    });
  } else {
    overlayMsg.textContent = "HLS не поддерживается в этом браузере";
    setStatus("Не поддерживается");
  }
}

function filtered() {
  const q = (searchEl.value || "").trim().toLowerCase();
  return CHANNELS.filter(ch => {
    if (activeGroup !== "Все" && ch.group !== activeGroup) return false;
    if (!q) return true;
    return (ch.name + " " + ch.group).toLowerCase().includes(q);
  });
}

function renderGroups() {
  const groups = ["Все", ...Array.from(new Set(CHANNELS.map(c => c.group).filter(Boolean))).sort()];
  groupsEl.innerHTML = "";
  groups.forEach(g => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (g === activeGroup ? " active" : "");
    b.textContent = g;
    b.onclick = () => { activeGroup = g; renderGroups(); renderList(); };
    groupsEl.appendChild(b);
  });
}

function renderList() {
  const items = filtered();
  listEl.innerHTML = "";
  items.forEach((ch, idx) => {
    const globalIdx = CHANNELS.indexOf(ch) + 1;
    const row = document.createElement("div");
    row.className = "channel" + (current && current.url === ch.url ? " active" : "");
    row.onclick = () => playChannel(ch);

    let logoHtml;
    if (ch.logo) {
      logoHtml = `<img class="ch-logo" src="${ch.logo}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'ch-logo placeholder\\'>${escapeHtml(ch.name.slice(0,2))}</div>'">`;
    } else {
      logoHtml = `<div class="ch-logo placeholder">${escapeHtml(ch.name.slice(0,2))}</div>`;
    }

    row.innerHTML = `
      ${logoHtml}
      <div class="ch-meta">
        <div class="ch-name">${escapeHtml(ch.name)}</div>
        <div class="ch-group">${escapeHtml(ch.group || "")}</div>
      </div>
      <div class="ch-num">${globalIdx}</div>
    `;
    listEl.appendChild(row);
  });
  if (!items.length) {
    listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted)">Ничего не найдено</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

searchEl.addEventListener("input", renderList);

document.getElementById("fsBtn").onclick = () => {
  const el = document.getElementById("playerWrap");
  if (!document.fullscreenElement) el.requestFullscreen?.() || el.webkitRequestFullscreen?.();
  else document.exitFullscreen?.();
};

document.getElementById("themeBtn").onclick = () => {
  dark = !dark;
  if (dark) {
    document.documentElement.style.setProperty("--bg", "#0b0d12");
    document.documentElement.style.setProperty("--surface", "#141820");
    document.documentElement.style.setProperty("--surface2", "#1a1f2a");
    document.documentElement.style.setProperty("--stroke", "#2a3140");
    document.documentElement.style.setProperty("--text", "#eef1f6");
    document.documentElement.style.setProperty("--muted", "#8b95a8");
  } else {
    document.documentElement.style.setProperty("--bg", "#f7f8fa");
    document.documentElement.style.setProperty("--surface", "#ffffff");
    document.documentElement.style.setProperty("--surface2", "#eef1f6");
    document.documentElement.style.setProperty("--stroke", "#e3e7ee");
    document.documentElement.style.setProperty("--text", "#17212f");
    document.documentElement.style.setProperty("--muted", "#657083");
  }
};

video.addEventListener("playing", () => {
  overlay.classList.remove("show");
  setStatus("В эфире");
});
video.addEventListener("waiting", () => setStatus("Буферизация…"));
video.addEventListener("pause", () => { if (current) setStatus("Пауза"); });

renderGroups();
renderList();

// auto-play first channel attempt (optional — user can click)
// playChannel(CHANNELS[0]);
</script>
</body>
</html>
